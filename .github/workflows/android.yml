name: Android CI

on:
  push:
    branches:
      - dev
      - master
    tags:
      - '*'

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      SPLITS_INCLUDE: "TRUE"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust_adblock"

      - name: Decode and Save Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/keystore.jks
          chmod 600 $GITHUB_WORKSPACE/keystore.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed APKs
        run: ./gradlew assembleRelease --info

      - name: Upload APKs to GitHub Artifacts
        uses: actions/upload-artifact@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: apk-files
          path: app/build/outputs/apk/release/*.apk

  release:
    name: Release APKs
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs from build
        uses: actions/download-artifact@v4
        with:
          name: apk-files
          path: apk-release

      - name: Upload Release APKs
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.GH_PAT }}
          prerelease: true
          body: |
            ### Since 0.9.1-RC-2:
            - Fixed detector's bug, when master M3U8/MPD master list could skip if early was detected smth from it
            - Added reason fail for regular media, if it because treshold


            ## Since 0.8.25.9:

            ### Added
            - Added detection logging to UI (for now it shows what type of detector what do (detector type, state(start, error success) and url))
            - Import/Export history from\to file added
            - Import/Export bookmarks from\to file added
            - App's temporary directory moved to cache directory
            - Added advanced guide
            - Added additional info for settings
            - Detection enhanced(more streaming platforms support)


            ### Fixed
            - Implemented Nested WebView (it fixes facebook scroll issue on verification screen for mobile mode)
            - Anubis firewall bypass fix
            - TikTok fix (for now working only by video url like facebook)
            - Blacklisted Cloudflare challenges for check on video
            - Upgraded all dependencies(also rust-adblocker upgaded to 0.13.3)
            - Built-in list replaced with osid
            - Crashes fixes
            - Minor fixes
          draft: false
          make_latest: false
          tag_name: ${{ github.ref_name }}
          files: apk-release/*.apk
